<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversaciones en vivo · ADAM</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171b2e; --panel2:#1e2440; --line:#2a3154;
    --text:#e8ecf8; --muted:#98a2c9; --accent:#3b82f6; --accent2:#22d3ee;
    --user:#2453c4; --assistant:#232a49; --ok:#22c55e; --err:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block}
  .dot.live{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.err{background:var(--err)}
  .status{color:var(--muted);font-size:12px}
  .spacer{flex:1}
  input[type=search]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 10px;width:220px}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  .keybar{padding:10px 18px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .keybar input{flex:1;max-width:320px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 10px}

  #feed{flex:1;overflow-y:auto;padding:16px 18px 24px}

  /* Sección = negocio */
  .tenant{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:14px;overflow:hidden}
  .tenant:first-child{margin-top:0}
  .tenant-hdr{display:flex;align-items:center;gap:8px;padding:9px 14px;background:var(--panel2);border-bottom:1px solid var(--line);font-weight:600;flex-wrap:wrap}
  .tenant-hdr .badge{font-size:11px;color:var(--muted);font-weight:400;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1px 8px}
  .threads{padding:10px 12px}

  /* Hilo = cliente dentro del negocio */
  .thread{border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:10px;overflow:hidden}
  .thread:last-child{margin-bottom:0}
  .thread-hdr{color:var(--muted);font-size:12px;padding:7px 12px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .thread-hdr b{color:var(--accent2);font-weight:600}
  .thread-hdr .cnt{font-size:11px;color:var(--muted)}
  .msgs{padding:8px 12px}

  .row{display:flex;margin:4px 0}
  .row.from{justify-content:flex-start}
  .row.to{justify-content:flex-end}
  .row.from .bubble{background:var(--user)}
  .row.to  .bubble{background:var(--assistant);border:1px solid var(--line)}
  .bubble{max-width:70%;padding:7px 11px;border-radius:12px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.35)}
  .bubble .meta{font-size:11px;color:rgba(255,255,255,.65);margin-bottom:3px}
  .bubble .time{opacity:.75}
  .empty, .err{color:var(--muted);text-align:center;padding:40px 20px}
  .err{color:var(--err)}
  .hidden{display:none !important}

  footer{padding:8px 18px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
</style>
</head>
<body>

<header>
  <h1>💬 Conversaciones en vivo</h1>
  <span class="dot" id="dot"></span>
  <span class="status" id="status">conectando…</span>
  <span class="spacer"></span>
  <input type="search" id="q" placeholder="Buscar por teléfono o contenido…">
  <button id="pauseBtn" title="Pausar la actualización">⏸</button>
</header>

<div class="keybar" id="keybar" style="display:none">
  <label>Clave del dashboard:</label>
  <input type="password" id="keyInput" placeholder="DASHBOARD_KEY">
  <button id="keyGo">Abrir</button>
</div>

<div id="feed"><div class="empty">Cargando…</div></div>

<footer>
  <span id="count"></span>
  <span style="margin-left:16px">Actualiza cada 2 s · izquierda = cliente · derecha = ADAM · ordenado por negocio → cliente (actividad reciente)</span>
</footer>

<script>
(function(){
  "use strict";
  var POLL_MS = 2000;
  var feed = document.getElementById('feed');
  var dot = document.getElementById('dot');
  var statusEl = document.getElementById('status');
  var qEl = document.getElementById('q');
  var pauseBtn = document.getElementById('pauseBtn');
  var keybar = document.getElementById('keybar');
  var keyInput = document.getElementById('keyInput');
  var keyGo = document.getElementById('keyGo');
  var countEl = document.getElementById('count');

  var key = '';
  var seen = new Set();      // ids ya renderizados (dedup)
  var lastTime = null;       // ISO del último mensaje visto (para ?after=)
  var paused = false;
  var loading = true;

  var sections = {};   // tenantId -> {el, threadsEl, hdrEl}
  var threads = {};    // convKey  -> {el, body, hdrEl, phone, tenantId, tenantEl}

  function convKey(m){ return m.tenantId + '|' + (m.phone || ''); }

  // ── Clave: del query primero; si no, la pide una única vez y la guarda en sessionStorage ──
  function initKey(){
    var m = /[?&]key=([^&]+)/.exec(location.search);
    if (m && m[1]){
      key = decodeURIComponent(m[1]);
      history.replaceState(null, '', location.pathname);
    } else {
      key = sessionStorage.getItem('dash_key') || '';
    }
    if (!key){ keybar.style.display = 'flex'; keyInput.focus(); }
    go();
  }
  function go(){
    var k = keyInput.value.trim();
    if (k){ keyInput.value=''; key = k; sessionStorage.setItem('dash_key', k); keybar.style.display='none'; }
    if (!key) return;
    loading = true;
    poll(true);
  }
  keyGo.addEventListener('click', go);
  keyInput.addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });

  // ── DOM helpers ──
  function makeEl(className, text){
    var el = document.createElement('div');
    el.className = className;
    if (text != null) el.textContent = text;
    return el;
  }

  function ensureSection(m){
    var tid = m.tenantId;
    var sec = sections[tid];
    if (!sec){
      var el = document.createElement('div');
      el.className = 'tenant';
      var hdr = makeEl('tenant-hdr');
      hdr.appendChild(makeEl('span', m.tenantName || 'Negocio'));
      var bad = document.createElement('span'); bad.className='badge'; bad.textContent='negocio';
      hdr.appendChild(bad);
      var threadsEl = document.createElement('div'); threadsEl.className='threads';
      el.appendChild(hdr); el.appendChild(threadsEl);
      sec = { el: el, hdrEl: hdr, threadsEl: threadsEl };
      sections[tid] = sec;
    }
    return sec;
  }

  function ensureThread(m){
    var ck = convKey(m);
    var th = threads[ck];
    if (!th){
      var sec = ensureSection(m);
      var el = document.createElement('div');
      el.className = 'thread';
      var hdr = makeEl('thread-hdr');
      var b = document.createElement('b'); b.textContent = '@' + (m.phone || '?');
      var cnt = document.createElement('span'); cnt.className='cnt'; cnt.textContent='0 msgs';
      hdr.appendChild(b); hdr.appendChild(cnt);
      var body = document.createElement('div'); body.className='msgs';
      el.appendChild(hdr); el.appendChild(body);
      sec.threadsEl.appendChild(el);
      th = { el: el, body: body, hdrEl: hdr, cntEl: cnt, phone: m.phone||'', tenantId: m.tenantId, sec: sec };
      threads[ck] = th;
    }
    return th;
  }

  // Ordena por actividad reciente: al recibir un mensaje, su hilo sube a tope del negocio
  // y su sección (negocio) sube a tope del feed.
  function touch(m){
    var th = ensureThread(m);
    var sec = th.sec;
    if (sec.threadsEl.firstChild !== th.el) sec.threadsEl.insertBefore(th.el, sec.threadsEl.firstChild);
    if (feed.firstChild !== sec.el) feed.insertBefore(sec.el, feed.firstChild);
    return th;
  }

  // ── Poll ──
  function buildUrl(initial){
    var u = '/api/v1/dashboard/conversations?key=' + encodeURIComponent(key);
    if (!initial && lastTime) u += '&after=' + encodeURIComponent(lastTime);
    return u;
  }
  function poll(initial){
    if (!key){ return; }
    fetch(buildUrl(initial)).then(function(r){
      if (r.status === 401){ throw new Error('Clave inválida'); }
      if (!r.ok){ throw new Error('HTTP ' + r.status); }
      return r.json();
    }).then(function(data){
      if (!data || !Array.isArray(data.messages)) throw new Error('Respuesta inválida');
      append(data.messages);
      setStatus(true);
    }).catch(function(err){
      setStatus(false, err.message);
    }).finally(function(){
      loading = false;
    });
  }

  function append(msgs){
    var changed = false;
    var ph = feed.querySelector('.empty');
    if (ph) ph.remove();
    msgs.forEach(function(m){
      if (seen.has(m.id)) return;
      seen.add(m.id);
      if (!lastTime || m.time > lastTime) lastTime = m.time;

      var th = touch(m);
      var fromClient = m.role === 'user';
      var row = document.createElement('div');
      row.className = 'row ' + (fromClient ? 'from' : 'to');
      row.dataset.text = (m.content||'').toLowerCase();
      row.dataset.phone = (m.phone||'').toLowerCase();
      row.innerHTML = '<div class="bubble"><div class="meta">' +
        (fromClient ? '🟢 Cliente' : '🤖 ADAM') +
        ' <span class="time">' + esc(fmtTime(m.time)) + '</span></div>' +
        esc(m.content || '') + '</div>';
      th.body.appendChild(row);
      th.cntEl.textContent = (parseInt(th.cntEl.textContent, 10) || 0) + 1 + ' msgs';
      changed = true;
    });
    if (changed){ applyFilter(); refreshCount(); }
  }

  function applyFilter(){
    var q = qEl.value.trim().toLowerCase();
    Object.keys(threads).forEach(function(ck){
      var th = threads[ck];
      var show = false;
      var rows = th.body.querySelectorAll('.row');
      for (var i=0;i<rows.length;i++){
        var r = rows[i];
        var txt = (r.dataset.text || '') + ' ' + r.dataset.phone;
        var ok = !q || txt.indexOf(q) !== -1;
        r.style.display = ok ? '' : 'none';
        if (ok) show = true;
      }
      if (!q && rows.length) show = true;
      th.el.classList.toggle('hidden', !show && rows.length > 0);
    });
    Object.keys(sections).forEach(function(tid){
      var sec = sections[tid];
      var any = Array.prototype.some.call(sec.threadsEl.children, function(c){
        return !c.classList.contains('hidden');
      });
      sec.el.classList.toggle('hidden', !any);
    });
    scrollToBottom();
  }

  function refreshCount(){
    countEl.textContent = seen.size + ' mensaje' + (seen.size===1?'':'s') +
      ' · ' + Object.keys(threads).length + ' conversación' + (Object.keys(threads).length===1?'':'es') +
      ' · ' + Object.keys(sections).length + ' negocio' + (Object.keys(sections).length===1?'':'s');
  }

  function scrollToBottom(){ feed.scrollTop = feed.scrollHeight; }

  function setStatus(ok, msg){
    dot.className = 'dot ' + (ok ? 'live' : 'err');
    if (ok) statusEl.textContent = 'En vivo · ' + new Date().toLocaleTimeString();
    else statusEl.textContent = 'Error: ' + (msg || 'sin conexión') + ' reintentando…';
    if (!ok) dot.textContent='';
  }

  function fmtTime(t){
    if (!t) return '';
    try { return new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
    catch(e){ return String(t); }
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ── Controles ──
  qEl.addEventListener('input', applyFilter);
  pauseBtn.addEventListener('click', function(){
    paused = !paused;
    pauseBtn.textContent = paused ? '▶' : '⏸';
    pauseBtn.title = paused ? 'Reanudar' : 'Pausar';
    if (!paused) poll();
  });

  setInterval(function(){ if (!paused && !loading) poll(); }, POLL_MS);

  initKey();
})();
</script>
</body>
</html>
