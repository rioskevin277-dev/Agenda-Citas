<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversaciones en vivo · ADAM</title>
<style>
  :root{
    --bg:#0f1220; --panel:#171b2e; --panel2:#1e2440; --line:#2a3154;
    --text:#e8ecf8; --muted:#98a2c9; --accent:#3b82f6;
    --user:#2453c4; --assistant:#232a49; --ok:#22c55e; --err:#ef4444;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--muted);display:inline-block}
  .dot.live{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .dot.err{background:var(--err)}
  .status{color:var(--muted);font-size:12px}
  .spacer{flex:1}
  input[type=search]{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 10px;width:220px}
  button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  .keybar{padding:10px 18px;background:var(--panel2);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .keybar input{flex:1;max-width:320px;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:7px 10px}
  #feed{flex:1;overflow-y:auto;padding:16px 18px 24px}
  .thread-hdr{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.4px;margin:18px 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .thread-hdr:first-child{margin-top:0}
  .thread-hdr b{color:var(--accent);font-weight:600}
  .row{display:flex;margin:4px 0}
  .row.from .bubble{background:var(--user)}
  .row.to  .bubble{background:var(--assistant);border:1px solid var(--line)}
  .from{justify-content:flex-start}
  .to{justify-content:flex-end}
  .bubble{max-width:68%;padding:8px 12px;border-radius:12px;white-space:pre-wrap;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.35)}
  .bubble .meta{font-size:11px;color:rgba(255,255,255,.65);margin-bottom:3px}
  .bubble .time{opacity:.75}
  .empty, .err{color:var(--muted);text-align:center;padding:40px 20px}
  .err{color:var(--err)}
  footer{padding:8px 18px;background:var(--panel);border-top:1px solid var(--line);color:var(--muted);font-size:12px}
</style>
</head>
<body>

<header>
  <h1>💬 Conversaciones en vivo</h1>
  <span class="dot" id="dot"></span>
  <span class="status" id="status">conectando…</span>
  <span class="spacer"></span>
  <input type="search" id="q" placeholder="Buscar por teléfono o contenido…">
  <button id="pauseBtn" title="Pausar la actualización">⏸</button>
</header>

<div class="keybar" id="keybar" style="display:none">
  <label>Clave del dashboard:</label>
  <input type="password" id="keyInput" placeholder="DASHBOARD_KEY">
  <button id="keyGo">Abrir</button>
</div>

<div id="feed"><div class="empty">Cargando…</div></div>

<footer>
  <span id="count"></span>
  <span style="margin-left:16px">Actualiza cada 2 s · izquierda = cliente · derecha = ADAM</span>
</footer>

<script>
(function(){
  "use strict";
  var POLL_MS = 2000;
  var feed = document.getElementById('feed');
  var dot = document.getElementById('dot');
  var statusEl = document.getElementById('status');
  var qEl = document.getElementById('q');
  var pauseBtn = document.getElementById('pauseBtn');
  var keybar = document.getElementById('keybar');
  var keyInput = document.getElementById('keyInput');
  var keyGo = document.getElementById('keyGo');
  var countEl = document.getElementById('count');

  var key = '';
  var seen = new Set();      // ids ya renderizados (dedup por colisiones de timestamp)
  var lastTime = null;       // ISO del último mensaje visto (para ?after=)
  var paused = false;
  var loading = true;
  var lastPhone = null;

  // ── Clave: del query primero; si no, la pide una única vez y la guarda en sessionStorage ──
  function initKey(){
    var m = /[?&]key=([^&]+)/.exec(location.search);
    if (m && m[1]){
      key = decodeURIComponent(m[1]);
      // Limpiar el secret de la URL (no queda en el historial).
      history.replaceState(null, '', location.pathname);
    } else {
      key = sessionStorage.getItem('dash_key') || '';
    }
    if (!key){ keybar.style.display = 'flex'; keyInput.focus(); }
    go();
  }
  function go(){
    var k = keyInput.value.trim();
    if (k){ keyInput.value=''; key = k; sessionStorage.setItem('dash_key', k); keybar.style.display='none'; }
    if (!key) return;
    loading = true;
    poll(true);
  }
  keyGo.addEventListener('click', go);
  keyInput.addEventListener('keydown', function(e){ if(e.key==='Enter') go(); });

  // ── Poll ──
  function buildUrl(initial){
    var u = '/api/v1/dashboard/conversations?key=' + encodeURIComponent(key);
    if (!initial && lastTime) u += '&after=' + encodeURIComponent(lastTime);
    return u;
  }
  function poll(initial){
    if (!key){ return; }
    fetch(buildUrl(initial)).then(function(r){
      if (r.status === 401){ throw new Error('Clave inválida');
      }
      if (!r.ok){ throw new Error('HTTP ' + r.status); }
      return r.json();
    }).then(function(data){
      if (!data || !Array.isArray(data.messages)) throw new Error('Respuesta inválida');
      append(data.messages);
      setStatus(true);
    }).catch(function(err){
      setStatus(false, err.message);
    }).finally(function(){
      loading = false;
    });
  }

  function append(msgs){
    var changed = false;
    msgs.forEach(function(m){
      if (seen.has(m.id)) return;           // dedup por id (colisiones de timestamp)
      seen.add(m.id);
      if (!lastTime || m.time > lastTime) lastTime = m.time;
      renderThread(m);
      changed = true;
    });
    if (changed){ applyFilter(); refreshCount(); }
  }

  function renderThread(m){
    if (m.phone !== lastPhone){
      var h = document.createElement('div');
      h.className = 'thread-hdr';
      h.dataset.phone = m.phone || '';
      h.innerHTML = '<span><b>@' + esc(m.phone || '?') + '</b></span>' +
                    (m.tenantName ? '<span>' + esc(m.tenantName) + '</span>' : '');
      feed.appendChild(h);
      lastPhone = m.phone;
    }
    var row = document.createElement('div');
    var fromClient = m.role === 'user';
    row.className = 'row ' + (fromClient ? 'from' : 'to');
    row.dataset.phone = m.phone || (m.phone||'');
    row.dataset.text = (m.content||'').toLowerCase();
    row.innerHTML = '<div class="bubble"><div class="meta">' +
      (fromClient ? '🟢 Cliente' : '🤖 ADAM') +
      ' <span class="time">' + esc(fmtTime(m.time)) + '</span></div>' +
      esc(m.content || '') + '</div>';
    feed.appendChild(row);
  }

  function applyFilter(){
    var q = qEl.value.trim().toLowerCase();
    var els = feed.querySelectorAll('.row, .thread-hdr');
    for (var i=0;i<els.length;i++){
      var el = els[i];
      var phone = (el.dataset.phone || '').toLowerCase();
      var text = (el.dataset.text || '').toLowerCase();
      var show = !q || phone.indexOf(q) !== -1 || text.indexOf(q) !== -1;
      el.style.display = show ? '' : 'none';
    }
    scrollToBottom();
  }

  function refreshCount(){
    countEl.textContent = seen.size + ' mensaje' + (seen.size===1?'':'s');
  }

  function scrollToBottom(){
    feed.scrollTop = feed.scrollHeight;
  }

  function setStatus(ok, msg){
    dot.className = 'dot ' + (ok ? 'live' : 'err');
    if (ok) statusEl.textContent = 'En vivo · ' + new Date().toLocaleTimeString();
    else statusEl.textContent = 'Error: ' + (msg || 'sin conexión') + ' reintentando…';
    if (!ok) dot.textContent='';
  }

  function fmtTime(t){
    if (!t) return '';
    try { return new Date(t).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'}); }
    catch(e){ return String(t); }
  }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ── Controles ──
  qEl.addEventListener('input', applyFilter);
  pauseBtn.addEventListener('click', function(){
    paused = !paused;
    pauseBtn.textContent = paused ? '▶' : '⏸';
    pauseBtn.title = paused ? 'Reanudar' : 'Pausar';
    if (!paused) poll();
  });

  setInterval(function(){ if (!paused && !loading) poll(); }, POLL_MS);

  initKey();
})();
</script>
</body>
</html>
