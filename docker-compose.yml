services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: agenda-sqlserver
    restart: always
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${SQL_PASSWORD:-AgendaApi_Prod_ChangeMe!}
      - MSSQL_PID=Express
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - agenda-net
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SQL_PASSWORD:-AgendaApi_Prod_ChangeMe!}" -C -Q "SELECT 1" || exit 1
      interval: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agenda-api
    restart: always
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      - ConnectionStrings__AgendaDb=Server=sqlserver;Database=AgendaApi;User Id=sa;Password=${SQL_PASSWORD:-AgendaApi_Prod_ChangeMe!};TrustServerCertificate=True;MultipleActiveResultSets=true
      - TokenEncryption__MasterKey=${MASTER_KEY}
      - DASHBOARD_KEY=${DASHBOARD_KEY}
      - Jwt__Secret=${JWT_SECRET}
      - OpenAI__ApiKey=${OPENAI_API_KEY}
      - Anthropic__ApiKey=${ANTHROPIC_API_KEY}
      - WhatsApp__AccessToken=${WHATSAPP_ACCESS_TOKEN}
      - WhatsApp__PhoneNumberId=${WHATSAPP_PHONE_NUMBER_ID}
      - WhatsApp__VerifyToken=${WHATSAPP_VERIFY_TOKEN}
      - Groq__ApiKey=${GROQ_API_KEY}
      - OpenRouter__ApiKey=${OPENROUTER_API_KEY}
      - OpenRouter__Model=${OPENROUTER_MODEL:-nvidia/nemotron-3-super-120b-a12b:free}
      - OpenRouter__MaxTokens=${OPENROUTER_MAX_TOKENS:-1200}
      - GoogleOAuth__ClientId=${GoogleOAuth__ClientId}
      - GoogleOAuth__ClientSecret=${GoogleOAuth__ClientSecret}
      - MicrosoftOAuth__ClientId=${MicrosoftOAuth__ClientId}
      - MicrosoftOAuth__ClientSecret=${MicrosoftOAuth__ClientSecret}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - Calendar__TimeZone=${Calendar__TimeZone}
      - Notificaciones__WhatsAppDueno=${NOTIFICACIONES_WHATSAPP_DUENO}
      - WhatsApp__RecordatorioTemplate24h=${WHATSAPP_RECORDATORIO_TEMPLATE_24H}
      - WhatsApp__RecordatorioTemplate2h=${WHATSAPP_RECORDATORIO_TEMPLATE_2H}
      - ASPNETCORE_URLS=http://+:8080
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - agenda-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: agenda-cloudflared
    restart: always
    # http2 (TCP) en vez de quic (UDP): en redes/WSL2 el UDP 7844 de Cloudflare suele
    # estar bloqueado y el túnel nunca completa el handshake ("Failed to dial a quic connection").
    environment:
      - TUNNEL_TRANSPORT_PROTOCOL=http2
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run 6c10be19-691e-4aa5-929d-922869d20948
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/6c10be19-691e-4aa5-929d-922869d20948.json:/etc/cloudflared/6c10be19-691e-4aa5-929d-922869d20948.json:ro
    depends_on:
      - api
    networks:
      - agenda-net
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  sqlserver-data:

networks:
  agenda-net:
    driver: bridge
