name: Deploy (auto)

# Se dispara DESPUÉS de que el CI pase (test/build OK) en main.
# Conecta por SSH al servidor, hace git pull y reconstruye/levantado los
# contenedores. Sin dependencias de Docker Hub: la imagen se compila en el
# propio servidor con el Dockerfile multi-etapa.
#
# Secrets requeridos en GitHub (Settings -> Secrets -> Actions):
#   DEPLOY_HOST    -> IP o dominio del servidor
#   DEPLOY_USER    -> usuario SSH (con permisos de docker)
#   DEPLOY_SSH_KEY -> clave privada SSH del usuario
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH (git pull + docker compose build)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /opt/agenda-api/app
            git fetch origin main
            git checkout main
            git pull --ff-only
            docker compose --env-file ../.env up -d --build
            docker system prune -f
            echo "--- Health check ---"
            sleep 6
            curl -s http://localhost:8080/health && echo